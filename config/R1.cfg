hostname R1-YixuanHuang
!
! ---------------------------------------------------------------------------
! Access control
!
! NOTE 1 - the trailing permit is required. A Cisco ACL ends with an implicit
! "deny ip any any", so a list containing only a deny drops every packet
! leaving Fa0/1, not just VLAN 2's web traffic.
!
! NOTE 2 - the deny below cannot match while R0 translates the source address
! before the packet reaches this router. By the time R1 evaluates the rule the
! source is 20.10.2.100 or .101, not 192.168.2.x. The filter belongs inbound on
! R0's Fa0/0, before NAT. See docs/known-issues.md.
! ---------------------------------------------------------------------------
ip access-list extended 100
 deny   tcp 192.168.2.0 0.0.0.255 host 10.10.10.2 eq www
 permit ip any any
!
interface FastEthernet0/0
 ip address 20.10.2.2 255.255.255.0
 no shutdown
 duplex auto
 speed auto
!
interface FastEthernet0/1
 ip address 10.10.10.1 255.255.255.0
 ip access-group 100 out
 no shutdown
 duplex auto
 speed auto
!
router rip
 version 2
 network 10.10.10.0
 network 20.10.2.0
 no auto-summary
!
ip classless
!
line con 0
line aux 0
line vty 0 4
 login
!
